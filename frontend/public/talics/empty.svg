<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2433" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06080d" stop-opacity="0.8"/>
    </radialGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="20" cy="20" r="18" fill="url(#bg)" stroke="#1c2433" stroke-width="1.5"/>
  <!-- Inner subtle ring -->
  <circle cx="20" cy="20" r="13" fill="none" stroke="#1c2433" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Center dot -->
  <circle cx="20" cy="20" r="2" fill="#1c2433" opacity="0.7"/>
</svg>
