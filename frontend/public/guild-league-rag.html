3BerEDBE35nkqew2h9GLquXf5SskJxvi81anIl8juwOwYYC8cBbCen8XsOjKZ3xlrB/guJVTHRT90cgKJ8fQ96QzhswQbPbilrs48LGDeeTSkLKO3I+SY9sJYLItHMyHt6sS2TBzI2EHPooSyL9apwti3wvrLnlGqVSIAAAAA=" alt="Mapa limpo do Subfield do antigo Guild League">
    <canvas id="ink" width="704" height="360"></canvas>
  </div>
  <div id="hint">Arraste para mover • roda do mouse para zoom • ative “Rabiscar” para desenhar no mapa</div>
</div>

<script>
const stage=document.getElementById('stage');
const world=document.getElementById('world');
const ink=document.getElementById('ink');
const ctx=ink.getContext('2d');

let scale=1,x=0,y=0;
let dragging=false,drawing=false,drawMode=false;
let sx=0,sy=0,ox=0,oy=0;
let history=[];

function apply(){
  world.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
}

function center(){
  x=(stage.clientWidth-704*scale)/2;
  y=(stage.clientHeight-360*scale)/2;
  apply();
}

function zoomAt(f,cx=stage.clientWidth/2,cy=stage.clientHeight/2){
  const old=scale;
  const next=Math.max(0.45,Math.min(4,old*f));
  const wx=(cx-x)/old;
  const wy=(cy-y)/old;
  scale=next;
  x=cx-wx*next;
  y=cy-wy*next;
  apply();
}

function mapPoint(e){
  const r=ink.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*(704/r.width),
    y:(e.clientY-r.top)*(360/r.height)
  };
}

function saveHistory(){
  history.push(ctx.getImageData(0,0,704,360));
  if(history.length>30) history.shift();
}

function startDraw(e){
  if(!drawMode) return;
  drawing=true;
  saveHistory();
  const p=mapPoint(e);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
}

function moveDraw(e){
  if(!drawing) return;
  const p=mapPoint(e);
  ctx.strokeStyle=document.getElementById('color').value;
  ctx.lineWidth=Number(document.getElementById('size').value);
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
}

function endDraw(){
  if(drawing) ctx.closePath();
  drawing=false;
}

ink.addEventListener('pointerdown',startDraw);
ink.addEventListener('pointermove',moveDraw);
ink.addEventListener('pointerup',endDraw);
ink.addEventListener('pointercancel',endDraw);

stage.addEventListener('pointerdown',e=>{
  if(drawMode) return;
  dragging=true;
  stage.setPointerCapture(e.pointerId);
  sx=e.clientX; sy=e.clientY;
  ox=x; oy=y;
  world.classList.add('drag');
});

stage.addEventListener('pointermove',e=>{
  if(!dragging) return;
  x=ox+e.clientX-sx;
  y=oy+e.clientY-sy;
  apply();
});

stage.addEventListener('pointerup',()=>{
  dragging=false;
  world.classList.remove('drag');
});

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.12:0.89,e.clientX-r.left,e.clientY-r.top);
},{passive:false});

document.getElementById('drawBtn').addEventListener('click',()=>{
  drawMode=!drawMode;
  ink.classList.toggle('draw',drawMode);
  document.getElementById('drawBtn').classList.toggle('active',drawMode);
  document.getElementById('drawBtn').textContent=drawMode?'✋ Sair do rabisco':'✏️ Rabiscar';
});

document.getElementById('undo').addEventListener('click',()=>{
  if(history.length) ctx.putImageData(history.pop(),0,0);
});

document.getElementById('clear').addEventListener('click',()=>{
  saveHistory();
  ctx.clearRect(0,0,704,360);
});

document.getElementById('center').addEventListener('click',center);
document.getElementById('plus').addEventListener('click',()=>zoomAt(1.25));
document.getElementById('minus').addEventListener('click',()=>zoomAt(0.8));

requestAnimationFrame(center);
</script>
</body>
</html>
