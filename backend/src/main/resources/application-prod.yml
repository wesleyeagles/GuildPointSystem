spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 30000
  flyway:
    locations: classpath:db/migration,classpath:db/migration-prod
    connect-retries: 15
    connect-retries-interval: 5

guild:
  jwt:
    secret: ${JWT_SECRET}
  oauth:
    frontend-url: ${OAUTH_FRONTEND_URL:https://blacklist.guildsystem.com.br}
  upload:
    base-path: ${UPLOAD_PATH:/data/uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS}

logging:
  level:
    root: INFO
    com.guild.app: INFO
