spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

guild:
  jwt:
    secret: ${JWT_SECRET}
  upload:
    base-path: ${UPLOAD_PATH:/data/uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS}

logging:
  level:
    root: INFO
    com.guild.app: INFO
